name: Build & deploy portfolio

on:
  push:
    branches: [main]
  schedule:
    - cron: "0 10 * * *"   # daily at 6 AM Eastern
  workflow_dispatch:        # adds a "Run workflow" button

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Pull projects tagged "portfolio"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p site/data
          gh api "search/repositories?q=user:${{ github.repository_owner }}+topic:portfolio&sort=updated" \
            --jq '[.items[] | {name, description, url: .html_url, homepage, topics, updated: .updated_at, stars: .stargazers_count}]' \
            > site/data/projects.json
          echo "Found $(jq length site/data/projects.json) projects"

      - name: Deploy to Azure Static Web Apps
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_ZEALOUS_ISLAND_08A474A10 }}
          action: upload
          app_location: site
          api_location: api          # Azure Functions (contact form)
          output_location: ""
          skip_app_build: true       # site is plain HTML, nothing to build
          # the api IS built (npm install) by the deploy action
